<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code Editor</title>

<style>
:root {
    --bg: #1e1e1e;
    --panel: #252526;
    --panel2: #2d2d2d;
    --border: #3a3a3c;
    --border2: #454545;
    --text: #d4d4d4;
    --dim: #858585;
    --accent: #4fc1e9;
    --accent-dim: #2f8fb3;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Consolas, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar {
    height: 40px;
    min-height: 40px;
    display: flex;
    align-items: center;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
}

.brand {
    color: var(--dim);
    font-size: 13px;
    margin-left: 5px;
    user-select: none;
}

/* =========================================================
   TABS
========================================================= */

#tabs {
    height: 36px;
    min-height: 36px;
    display: flex;
    align-items: stretch;
    background: #1b1b1c;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
}

#tabs::-webkit-scrollbar {
    height: 0;
}

.tab {
    height: 36px;
    min-width: 130px;
    max-width: 220px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 11px;
    background: #1f1f20;
    color: var(--dim);
    border-right: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition:
        background .15s ease,
        color .15s ease;
}

.tab:hover {
    background: #29292a;
    color: var(--text);
}

.tab.active {
    background: var(--bg);
    color: var(--text);
}

.tab-name {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12px;
}

.tab-close {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    color: var(--dim);
    font-size: 14px;
    transition:
        background .15s ease,
        color .15s ease;
}

.tab-close:hover {
    background: #3a3a3a;
    color: white;
}

#new-tab {
    width: 38px;
    height: 36px;
    border: 0;
    background: transparent;
    color: var(--dim);
    font-size: 18px;
    cursor: pointer;
}

#new-tab:hover {
    background: #292929;
    color: var(--text);
}

/* =========================================================
   BODY
========================================================= */

#body {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
}

#container {
    flex: 1;
    min-width: 0;
    height: 100%;
}

/* =========================================================
   SETTINGS
========================================================= */

#settings {
    width: 260px;
    min-width: 260px;
    height: 100%;
    background: var(--panel);
    border-left: 1px solid var(--border);

    transform: translateX(0);
    transition:
        transform .2s ease,
        opacity .2s ease;

    overflow-y: auto;
}

#settings.collapsed {
    transform: translateX(100%);
    margin-left: -260px;
    opacity: 0;
    pointer-events: none;
}

.settings-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
}

.settings-section h3 {
    margin: 0 0 12px;
    font-size: 11px;
    font-weight: 600;
    color: var(--dim);
    letter-spacing: .5px;
}

.field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.field:last-child {
    margin-bottom: 0;
}

.field label {
    font-size: 12.5px;
    color: var(--text);
}

.field select,
.field input[type="number"] {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border2);
    border-radius: 4px;
    outline: none;
    padding: 4px 6px;
    font-size: 12px;
}

.field select {
    width: 118px;
}

.field input[type="number"] {
    width: 60px;
}

/* =========================================================
   REAL WORKING TOGGLES
========================================================= */

.switch {
    position: relative;
    width: 34px;
    height: 18px;
    flex: 0 0 34px;
    cursor: pointer;
}

.switch input {
    position: absolute;
    opacity: 0;
    width: 34px;
    height: 18px;
    margin: 0;
    cursor: pointer;
    z-index: 2;
}

.track {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--panel2);
    border: 1px solid var(--border2);
    transition:
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

.track::before {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    left: 2px;
    top: 2px;
    border-radius: 50%;
    background: var(--dim);

    transition:
        transform .18s cubic-bezier(.4, 0, .2, 1),
        background .18s ease;
}

.switch input:checked + .track {
    background: var(--accent-dim);
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(79,193,233,.15);
}

.switch input:checked + .track::before {
    transform: translateX(16px);
    background: var(--accent);
}

/* =========================================================
   SETTINGS BUTTON
========================================================= */

#settings-toggle {
    margin-left: auto;
    width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;

    color: var(--dim);
    cursor: pointer;

    transition:
        background .15s ease,
        border-color .15s ease,
        color .15s ease;
}

#settings-toggle:hover {
    color: var(--text);
    background: var(--panel2);
    border-color: var(--border2);
}

#settings-toggle svg {
    width: 16px;
    height: 16px;
}

/* =========================================================
   SCROLLBAR
========================================================= */

#settings::-webkit-scrollbar {
    width: 7px;
}

#settings::-webkit-scrollbar-thumb {
    background: var(--border2);
    border-radius: 5px;
}
</style>
</head>

<body>

<div id="app">

    <div id="topbar">
        <span class="brand">Editor</span>

        <button id="settings-toggle" title="Editor settings">
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <circle cx="12" cy="12" r="3"></circle>

                <path d="
                    M19.4 15
                    a1.65 1.65 0 0 0 .33 1.82
                    l.06.06
                    a2 2 0 1 1-2.83 2.83
                    l-.06-.06
                    a1.65 1.65 0 0 0-1.82-.33
                    1.65 1.65 0 0 0-1 1.51
                    V21
                    a2 2 0 0 1-4 0
                    v-.09
                    A1.65 1.65 0 0 0 9 19.4
                    a1.65 1.65 0 0 0-1.82.33
                    l-.06.06
                    a2 2 0 1 1-2.83-2.83
                    l.06-.06
                    a1.65 1.65 0 0 0 .33-1.82
                    1.65 1.65 0 0 0-1.51-1
                    H3
                    a2 2 0 0 1 0-4
                    h.09
                    A1.65 1.65 0 0 0 4.6 9
                    a1.65 1.65 0 0 0-.33-1.82
                    l-.06-.06
                    a2 2 0 1 1 2.83-2.83
                    l.06.06
                    a1.65 1.65 0 0 0 1.82.33
                    H9
                    a1.65 1.65 0 0 0 1-1.51
                    V3
                    a2 2 0 0 1 4 0
                    v.09
                    a1.65 1.65 0 0 0 1 1.51
                    1.65 1.65 0 0 0 1.82-.33
                    l.06-.06
                    a2 2 0 1 1 2.83 2.83
                    l-.06.06
                    a1.65 1.65 0 0 0-.33 1.82
                    V9
                    a1.65 1.65 0 0 0 1.51 1
                    H21
                    a2 2 0 0 1 0 4
                    h-.09
                    a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
        </button>
    </div>

    <!-- TABS -->
    <div id="tabs"></div>

    <div id="body">

        <div id="container"></div>

        <!-- SETTINGS -->
        <div id="settings" class="collapsed">

            <div class="settings-section">

                <h3>LANGUAGE</h3>

                <div class="field">
                    <label for="opt-language">Language</label>

                    <select id="opt-language">
                        <option value="lua">Lua</option>
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="python">Python</option>
                        <option value="json">JSON</option>
                        <option value="c">C</option>
                        <option value="cpp">C++</option>
                        <option value="csharp">C#</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="sql">SQL</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                        <option value="php">PHP</option>
                        <option value="xml">XML</option>
                        <option value="yaml">YAML</option>
                        <option value="markdown">Markdown</option>
                        <option value="plaintext">Plain Text</option>
                    </select>
                </div>

            </div>

            <div class="settings-section">

                <h3>APPEARANCE</h3>

                <div class="field">
                    <label for="opt-theme">Theme</label>

                    <select id="opt-theme">
                        <option value="vs-dark" selected>Dark</option>
                        <option value="vs">Light</option>
                        <option value="hc-black">High contrast</option>
                    </select>
                </div>

                <div class="field">
                    <label for="opt-fontsize">Font size</label>
                    <input
                        type="number"
                        id="opt-fontsize"
                        min="8"
                        max="32"
                        value="14">
                </div>

                <div class="field">
                    <label for="opt-minimap">Minimap</label>

                    <span class="switch">
                        <input type="checkbox" id="opt-minimap" checked>
                        <span class="track"></span>
                    </span>
                </div>

                <div class="field">
                    <label for="opt-wordwrap">Word wrap</label>

                    <span class="switch">
                        <input type="checkbox" id="opt-wordwrap">
                        <span class="track"></span>
                    </span>
                </div>

                <div class="field">
                    <label for="opt-linenumbers">Line numbers</label>

                    <span class="switch">
                        <input type="checkbox" id="opt-linenumbers" checked>
                        <span class="track"></span>
                    </span>
                </div>

                <div class="field">
                    <label for="opt-whitespace">Show whitespace</label>

                    <span class="switch">
                        <input type="checkbox" id="opt-whitespace">
                        <span class="track"></span>
                    </span>
                </div>

            </div>

            <div class="settings-section">

                <h3>EDITING</h3>

                <div class="field">
                    <label for="opt-tabsize">Tab size</label>

                    <select id="opt-tabsize">
                        <option value="2">2</option>
                        <option value="4" selected>4</option>
                        <option value="8">8</option>
                    </select>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/loader.js"></script>

<script>
(function () {

    "use strict";

    let editor = null;

    let tabs = [];
    let activeTabId = null;

    let tabCounter = 0;

    let pendingValue = null;

    /*
     * ---------------------------------------------------------
     * MONACO
     * ---------------------------------------------------------
     */

    require.config({
        paths: {
            vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs"
        }
    });

    require(["vs/editor/editor.main"], function () {

        editor = monaco.editor.create(
            document.getElementById("container"),
            {
                value: "",
                language: "lua",
                theme: "vs-dark",

                automaticLayout: true,

                minimap: {
                    enabled: true
                },

                fontSize: 14,

                tabSize: 4,

                wordWrap: "off",

                lineNumbers: "on",

                renderWhitespace: "none",

                scrollBeyondLastLine: false,

                smoothScrolling: true,

                cursorSmoothCaretAnimation: "on",

                cursorBlinking: "smooth",

                padding: {
                    top: 8,
                    bottom: 8
                },

                // Completely disable Monaco validation markers.
                // This prevents the red syntax-error decorations.
                validate: false
            }
        );

        /*
         * Initial tab
         */

        createTab(
            "script.lua",
            "lua",
            pendingValue || ""
        );

        pendingValue = null;

        /*
         * Cursor movement is still useful internally,
         * but there is no bottom status bar anymore.
         */

        editor.onDidChangeModelContent(function () {

            if (!activeTabId)
                return;

            const tab = getActiveTab();

            if (tab) {
                tab.value = editor.getValue();
            }

        });

    });

    /*
     * ---------------------------------------------------------
     * TAB SYSTEM
     * ---------------------------------------------------------
     */

    function createTab(name, language, value) {

        tabCounter++;

        const tab = {
            id: "tab-" + tabCounter,
            name: name,
            language: language,
            value: value || "",
            model: null
        };

        tabs.push(tab);

        if (editor) {

            tab.model = monaco.editor.createModel(
                tab.value,
                language
            );

            editor.setModel(tab.model);
        }

        activeTabId = tab.id;

        renderTabs();

        return tab;
    }

    function getActiveTab() {

        return tabs.find(function (tab) {
            return tab.id === activeTabId;
        });

    }

    function switchTab(id) {

        const tab = tabs.find(function (t) {
            return t.id === id;
        });

        if (!tab || !editor)
            return;

        /*
         * Save current tab.
         */

        const current = getActiveTab();

        if (current) {
            current.value = editor.getValue();
        }

        /*
         * Create model if it doesn't exist.
         */

        if (!tab.model) {

            tab.model = monaco.editor.createModel(
                tab.value,
                tab.language
            );

        }

        activeTabId = tab.id;

        editor.setModel(tab.model);

        renderTabs();
    }

    function closeTab(id) {

        const index = tabs.findIndex(function (t) {
            return t.id === id;
        });

        if (index === -1)
            return;

        const tab = tabs[index];

        if (tab.model) {
            tab.model.dispose();
        }

        tabs.splice(index, 1);

        /*
         * Always keep at least one tab.
         */

        if (tabs.length === 0) {

            createTab(
                "script.lua",
                "lua",
                ""
            );

            return;
        }

        /*
         * If the closed tab was active,
         * select a nearby tab.
         */

        if (activeTabId === id) {

            const nextIndex = Math.min(
                index,
                tabs.length - 1
            );

            switchTab(tabs[nextIndex].id);

        } else {

            renderTabs();

        }

    }

    function renderTabs() {

        const container = document.getElementById("tabs");

        container.innerHTML = "";

        tabs.forEach(function (tab) {

            const element = document.createElement("div");

            element.className =
                "tab" +
                (tab.id === activeTabId ? " active" : "");

            const name = document.createElement("span");

            name.className = "tab-name";

            name.textContent = tab.name;

            const close = document.createElement("span");

            close.className = "tab-close";

            close.textContent = "×";

            close.addEventListener("click", function (event) {

                event.stopPropagation();

                closeTab(tab.id);

            });

            element.appendChild(name);
            element.appendChild(close);

            element.addEventListener("click", function () {

                switchTab(tab.id);

            });

            container.appendChild(element);

        });

        const newButton = document.createElement("button");

        newButton.id = "new-tab";

        newButton.textContent = "+";

        newButton.title = "New tab";

        newButton.addEventListener("click", function () {

            createTab(
                "script" + (tabs.length + 1) + ".lua",
                "lua",
                ""
            );

        });

        container.appendChild(newButton);

    }

    /*
     * ---------------------------------------------------------
     * SETTINGS PANEL
     * ---------------------------------------------------------
     */

    document
        .getElementById("settings-toggle")
        .addEventListener("click", function () {

            document
                .getElementById("settings")
                .classList.toggle("collapsed");

            /*
             * Monaco needs to recalculate its dimensions
             * after the panel animation.
             */

            setTimeout(function () {

                if (editor)
                    editor.layout();

            }, 220);

        });

    /*
     * ---------------------------------------------------------
     * LANGUAGE
     * ---------------------------------------------------------
     */

    document
        .getElementById("opt-language")
        .addEventListener("change", function (event) {

            applyLanguage(event.target.value);

        });

    function applyLanguage(language) {

        const tab = getActiveTab();

        if (!tab || !editor)
            return;

        tab.language = language;

        monaco.editor.setModelLanguage(
            editor.getModel(),
            language
        );

        /*
         * Update filename extension.
         */

        const extensions = {
            lua: "lua",
            javascript: "js",
            typescript: "ts",
            python: "py",
            json: "json",
            c: "c",
            cpp: "cpp",
            csharp: "cs",
            html: "html",
            css: "css",
            sql: "sql",
            go: "go",
            rust: "rs",
            php: "php",
            xml: "xml",
            yaml: "yaml",
            markdown: "md",
            plaintext: "txt"
        };

        const baseName =
            tab.name.split(".")[0];

        tab.name =
            baseName +
            "." +
            (extensions[language] || "txt");

        renderTabs();
    }

    /*
     * ---------------------------------------------------------
     * THEME
     * ---------------------------------------------------------
     */

    document
        .getElementById("opt-theme")
        .addEventListener("change", function (event) {

            if (!editor)
                return;

            monaco.editor.setTheme(
                event.target.value
            );

        });

    /*
     * ---------------------------------------------------------
     * FONT SIZE
     * ---------------------------------------------------------
     */

    document
        .getElementById("opt-fontsize")
        .addEventListener("input", function (event) {

            if (!editor)
                return;

            const size =
                parseInt(event.target.value, 10);

            if (!isNaN(size)) {

                editor.updateOptions({
                    fontSize: Math.max(
                        8,
                        Math.min(32, size)
                    )
                });

            }

        });

    /*
     * ---------------------------------------------------------
     * MINIMAP
     * ---------------------------------------------------------
     */

    document
        .getElementById("opt-minimap")
        .addEventListener("change", function (event) {

            if (!editor)
                return;

            editor.updateOptions({
                minimap: {
                    enabled: event.target.checked
                }
            });

        });

    /*
     * ---------------------------------------------------------
     * WORD WRAP
     * ---------------------------------------------------------
     */

    document
        .getElementById("opt-wordwrap")
        .addEventListener("change", function (event) {

            if (!editor)
                return;

            editor.updateOptions({
                wordWrap:
                    event.target.checked
                        ? "on"
                        : "off"
            });

        });

    /*
     * ---------------------------------------------------------
     * LINE NUMBERS
     * ---------------------------------------------------------
     */

    document
        .getElementById("opt-linenumbers")
        .addEventListener("change", function (event) {

            if (!editor)
                return;

            editor.updateOptions({
                lineNumbers:
                    event.target.checked
                        ? "on"
                        : "off"
            });

        });

    /*
     * ---------------------------------------------------------
     * WHITESPACE
     * ---------------------------------------------------------
     */

    document
        .getElementById("opt-whitespace")
        .addEventListener("change", function (event) {

            if (!editor)
                return;

            editor.updateOptions({
                renderWhitespace:
                    event.target.checked
                        ? "all"
                        : "none"
            });

        });

    /*
     * ---------------------------------------------------------
     * TAB SIZE
     * ---------------------------------------------------------
     */

    document
        .getElementById("opt-tabsize")
        .addEventListener("change", function (event) {

            if (!editor)
                return;

            editor.updateOptions({
                tabSize:
                    parseInt(
                        event.target.value,
                        10
                    )
            });

        });

    /*
     * ---------------------------------------------------------
     * C# API
     * ---------------------------------------------------------
     */

    /*
     * getvalue()
     */

    window.getvalue = function () {

        if (!editor)
            return "";

        return editor.getValue();

    };

    /*
     * setvalue()
     *
     * Instant replacement.
     */

    window.setvalue = function (value) {

        value = value || "";

        if (!editor) {

            pendingValue = value;

            return;
        }

        const tab = getActiveTab();

        editor.setValue(value);

        if (tab)
            tab.value = value;

    };

    /*
     * ---------------------------------------------------------
     * SMOOTH TYPING
     * ---------------------------------------------------------
     *
     * C# can call:
     *
     * typevalue("hello world", 8)
     *
     * The second argument is milliseconds per character.
     */

    let typingToken = 0;

    window.typevalue = async function (
        value,
        speed
    ) {

        if (!editor)
            return;

        value = value || "";

        speed =
            Number.isFinite(speed)
                ? speed
                : 8;

        /*
         * Prevent an old animation from
         * continuing after another call.
         */

        const token = ++typingToken;

        editor.setValue("");

        let current = "";

        for (
            let i = 0;
            i < value.length;
            i++
        ) {

            if (token !== typingToken)
                return;

            current += value[i];

            editor.setValue(current);

            await new Promise(function (resolve) {

                setTimeout(
                    resolve,
                    speed
                );

            });

        }

        const tab = getActiveTab();

        if (tab)
            tab.value = value;

    };

    window.editorReady = false;

    window.getvalue = function () {
        return editor ? editor.getValue() : "";
    };

    window.setvalue = function (value) {
        if (!editor) {
            pendingValue = value;
            return;
        }

        editor.setValue(value || "");
    };

    window.clear = function () {
        if (!editor) return;

        typingToken++;
        editor.setValue("");
    };

    window.editorReady = true;

    /*
     * Faster helper.
     */

    window.typevaluefast = function (value) {

        return window.typevalue(
            value,
            2
        );

    };

    /*
     * ---------------------------------------------------------
     * LANGUAGE API
     * ---------------------------------------------------------
     */

    window.getlanguage = function () {

        const tab = getActiveTab();

        return tab
            ? tab.language
            : "lua";

    };

    window.setlanguage = function (language) {

        const select =
            document.getElementById(
                "opt-language"
            );

        select.value = language;

        applyLanguage(language);

    };

    /*
     * ---------------------------------------------------------
     * TAB API
     * ---------------------------------------------------------
     */

    window.newtab = function (
        name,
        language,
        value
    ) {

        return createTab(
            name || "script.lua",
            language || "lua",
            value || ""
        );

    };

    window.closetab = function () {

        if (activeTabId)
            closeTab(activeTabId);

    };

    window.gettabcount = function () {

        return tabs.length;

    };

    /*
     * ---------------------------------------------------------
     * INITIAL VALUE
     * ---------------------------------------------------------
     */

    window.onload = function () {

        /*
         * Nothing here intentionally.
         * Monaco handles initialization above.
         */

    };

})();
